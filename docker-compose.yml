# Local Postgres for developing/testing the Postgres path.
#
#   docker compose up -d
#   CAIRN_DEMO=true go run . --db "postgres://cairn:cairn@localhost:5432/cairn?sslmode=disable"
#   TEST_DATABASE_URL="postgres://cairn:cairn@localhost:5432/cairn_test?sslmode=disable" go test ./internal/store/

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
    ports:
      - "5432:5432"
    volumes:
      - cairn_pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cairn_pg:
